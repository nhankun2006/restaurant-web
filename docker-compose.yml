services:
  db:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: svcntt
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      # Persistent volume for PostgreSQL data
      - postgres_data:/var/lib/postgresql/data
      # Initial SQL scripts executed on first startup (auto-migration & seed)
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/seed_full_menu.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:svcntt@db:5432/restaurant
    volumes:
      # Mount static images folder so uploaded images persist across container restarts
      - ./backend/static/images:/app/static/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: restaurant_postgres_data
